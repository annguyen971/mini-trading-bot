services:
  # 1. PROXY (CỔNG BẢO MẬT)
  proxy:
    image: caddy:2-alpine
    env_file: .env
    restart: always
    ports: [ "80:80", "443:443" ]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    logging:
      driver: "json-file"
      options: { max-size: "100m", max-file: "5" }
    deploy: { resources: { limits: { cpus: '0.2', memory: 128M } } }

  # 2. DATABASE
  db:
    image: postgres:15
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_USER: hunter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hunter
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      - ./db/views.sql:/docker-entrypoint-initdb.d/01_views.sql:ro
      - ./db/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./db/tests:/docker-entrypoint-initdb.d/tests:ro
      - ./backups:/backups
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U hunter -d hunter" ]
      interval: 10s
      timeout: 3s
      retries: 10
    logging:
      driver: "json-file"
      options: { max-size: "100m", max-file: "5" }
    deploy: { resources: { limits: { cpus: '0.5', memory: 512M } } }

  # 3. API (BIND NỘI BỘ)
  api:
    build:
      context: ./src
      dockerfile: api/Dockerfile
    command: >
      sh -c "gunicorn api.main:app -k uvicorn.workers.UvicornWorker -w 2 --bind 0.0.0.0:8000"
    env_file: .env
    environment:
      - DB_URL=${DB_URL}
      - ADMIN_KEY=${ADMIN_KEY}
      - MACRO_TZ=${MACRO_TZ}
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - artifacts:/opt/artifacts:ro # Đọc .pkl
      - packs:/opt/packs # Viết/Đọc .zip cache
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://127.0.0.1:8000/readyz || exit 1" ]
      interval: 15s
      timeout: 3s
      retries: 8
    logging:
      driver: "json-file"
      options: { max-size: "100m", max-file: "5" }
    restart: always
    deploy: { resources: { limits: { cpus: '0.35', memory: 320M } } }

  # 4. WORKER (BATCH CHÍNH)
  worker:
    build:
      context: ./src
      dockerfile: worker/Dockerfile
    command: [ "python", "-m", "worker.main" ] # Chạy chờ hoặc chạy tác vụ dài
    env_file: .env
    environment:
      - DB_URL=${DB_URL}
      - ENABLE_MACRO_BLEND=${ENABLE_MACRO_BLEND}
      - MACRO_TZ=${MACRO_TZ}
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - artifacts:/opt/artifacts # Viết .pkl
      - packs:/opt/packs # Viết/Đọc .zip cache
      - ./src/worker/worker:/app/worker # Dev mount
    logging:
      driver: "json-file"
      options: { max-size: "100m", max-file: "5" }
    deploy: { resources: { limits: { cpus: '0.8', memory: 1.2G } } }
    restart: on-failure

  # 5. BACKTEST (CHỈ CHẠY KHI CẦN)
  worker_bt:
    build:
      context: ./src
      dockerfile: worker/Dockerfile
    command: [ "python", "-m", "worker.tasks_train", "--profile", "backtest" ]
    profiles: [ "backtest" ]
    env_file: .env
    environment:
      - DB_URL=${DB_URL}
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - artifacts:/opt/artifacts
      - packs:/opt/packs
    deploy: { resources: { limits: { cpus: '1.2', memory: 1.5G } } }
    logging:
      driver: "json-file"
      options: { max-size: "100m", max-file: "5" }

  # 6. SCRAPER (LUÔN CHẠY)
  scraper:
    build:
      context: ./src
      dockerfile: scraper/Dockerfile
    command: [ "python", "-m", "scraper.main" ]
    env_file: .env
    environment:
      - DB_URL=${DB_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      db: { condition: service_healthy }
    logging:
      driver: "json-file"
      options: { max-size: "100m", max-file: "5" }
    deploy: { resources: { limits: { cpus: '0.3', memory: 256M } } }
    restart: always

  # 7. DASHBOARD (BIND NỘI BỘ)
  dash:
    build:
      context: ./src
      dockerfile: dash/Dockerfile
    command: >
      sh -c "streamlit run dash/app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true"
    env_file: .env
    environment:
      - DB_URL=${DB_URL}
      # ---> ĐÃ SỬA: Thêm biến này để Dash gọi được API nội bộ <---
      - API_BASE_URL=http://api:8000
      # Giữ lại cái cũ cho chắc chắn (phòng khi code dùng tên biến khác)
      - API_URL=http://api:8000
    depends_on:
      db: { condition: service_healthy }
      api: { condition: service_healthy }
    logging:
      driver: "json-file"
      options: { max-size: "100m", max-file: "5" }
    deploy: { resources: { limits: { cpus: '0.25', memory: 256M } } }
    restart: always

  # 8. CRON (SIDECAR)
  cron:
    build: ./src/cron
    # profiles: [ "cron" ]  # Removed - always run in production
    volumes:
      - ./scripts/cron:/etc/periodic/custom:ro
      - /var/run/docker.sock:/var/run/docker.sock # Để chạy docker exec
    environment:
      CRON_TZ: UTC
    deploy: { resources: { limits: { cpus: '0.1', memory: 64M } } }

volumes:
  pgdata:
  caddy_data:
  artifacts:
  packs:
  backups: {}
